[package]
name = "inkwave"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy application for the INKWAVE Rust port (native desktop + WASM)"

[dependencies]
inkwave_sim = { path = "../inkwave_sim" }
bevy = "0.19.1"
# sim crate uses glam 0.30 (Bevy 0.19 bundles 0.32); bridge at the call site.
glam = "0.30"

# WebSocket I/O is target-specific: native uses tungstenite (its own thread +
# std::mpsc, PORT_MAP OQ-2), wasm uses the browser `WebSocket` via web-sys.
# Keeping tungstenite out of the wasm build avoids pulling rustls/getrandom
# onto wasm32 (unsupported there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# Task 19: TR-19.2 drives the real `NativeTransport` against the test-only
# relay shim. Dev-dependency only — it never enters the app or wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
relay-shim = { path = "../../tools/relay-shim" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "UrlSearchParams",
    "Performance",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
] }

[[bin]]
name = "inkwave"
path = "src/main.rs"
